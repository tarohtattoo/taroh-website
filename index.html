  <style>

    /* =========================================
       RESET
    ========================================= */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #050505;
    }

    body {
      background: #050505;
      color: #f4f4f4;
      font-family:
        Arial,
        Helvetica,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      line-height: 1.7;
      letter-spacing: 0.02em;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    ::selection {
      background: #f2f2f2;
      color: #050505;
    }


    /* =========================================
       VARIABLES
    ========================================= */

    :root {
      --black: #050505;
      --black2: #0a0a0a;
      --black3: #111111;

      --white: #f4f4f4;
      --gray: #9c9c9c;
      --gray2: #6d6d6d;

      --line: rgba(255, 255, 255, 0.14);

      --max: 1280px;
      --side: 20px;
    }


    /* =========================================
       COMMON
    ========================================= */

    .wrap {
      width: min(
        calc(100% - (var(--side) * 2)),
        var(--max)
      );

      margin-inline: auto;
    }

    .section {
      padding: 94px 0;
      border-top: 1px solid var(--line);
    }

    .eyebrow {
      color: #aaa;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: clamp(42px, 12vw, 110px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      font-weight: 800;
    }

    .section-intro {
      margin-top: 28px;
      max-width: 620px;
      color: #aaa;
      font-size: 14px;
    }

    .button {
      min-height: 54px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 24px;

      border: 1px solid #fff;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;
    }

    .button-solid {
      background: #f5f5f5;
      color: #050505;
    }

    .button-outline {
      background: transparent;
      color: #f5f5f5;
    }

    .button:hover {
      background: #fff;
      color: #050505;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding-bottom: 4px;

      border-bottom: 1px solid #777;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    .muted {
      color: #888;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      position: fixed;

      top: 0;
      left: 0;
      width: 100%;

      height: 68px;

      z-index: 1000;

      display: flex;
      align-items: center;

      background:
        linear-gradient(
          to bottom,
          rgba(5, 5, 5, 0.96),
          rgba(5, 5, 5, 0.75)
        );

      backdrop-filter: blur(10px);

      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      width: min(
        calc(100% - 40px),
        var(--max)
      );

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.07em;
    }

    .logo-small {
      color: #777;
      font-size: 8px;
      letter-spacing: 0.2em;
      margin-left: 7px;
    }

    .menu-button {
      width: 44px;
      height: 44px;

      border: 0;
      background: transparent;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;

      cursor: pointer;
    }

    .menu-button span {
      display: block;

      width: 27px;
      height: 1px;

      margin-left: auto;

      background: #fff;

      transition: 0.25s;
    }

    .menu-button.active span:first-child {
      transform:
        translateY(4px)
        rotate(45deg);
    }

    .menu-button.active span:last-child {
      transform:
        translateY(-4px)
        rotate(-45deg);
    }


    /* =========================================
       NAV
    ========================================= */

    .nav {
      position: fixed;

      inset: 68px 0 0 0;

      z-index: 999;

      background: rgba(5, 5, 5, 0.985);

      display: none;

      padding: 40px 24px 100px;

      overflow-y: auto;
    }

    .nav.active {
      display: block;
    }

    .nav-inner {
      max-width: 700px;
      margin: auto;
    }

    .nav a {
      display: flex;
      justify-content: space-between;
      align-items: center;

      min-height: 61px;

      border-bottom: 1px solid var(--line);

      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .nav a span {
      color: #555;
      font-size: 10px;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: 100svh;

      padding:
        110px
        0
        80px;

      position: relative;

      display: flex;
      align-items: flex-end;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(255,255,255,0.07),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #111 0%,
          #050505 50%,
          #090909 100%
        );
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0.24;

      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255,255,255,0.015) 4px
        );

      pointer-events: none;
    }

    .hero-background-text {
      position: absolute;

      top: 19%;
      left: -4%;

      font-size: clamp(90px, 33vw, 460px);

      font-weight: 900;

      line-height: 0.7;

      letter-spacing: -0.09em;

      color: rgba(255,255,255,0.025);

      white-space: nowrap;

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-location {
      margin-bottom: 23px;

      font-size: 10px;
      letter-spacing: 0.18em;

      color: #aaa;
    }

    .hero h1 {
      font-size: clamp(67px, 22vw, 230px);

      line-height: 0.73;

      letter-spacing: -0.075em;

      font-weight: 900;

      margin-left: -5px;
    }

    .hero-subtitle {
      margin-top: 32px;

      max-width: 550px;

      font-size: 12px;
      line-height: 1.9;

      letter-spacing: 0.1em;

      color: #bbb;
    }

    .hero-actions {
      margin-top: 32px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      max-width: 420px;
    }

    .hero-note {
      margin-top: 28px;

      color: #666;

      font-size: 10px;
      letter-spacing: 0.08em;
    }


    /* =========================================
       INTRO
    ========================================= */

    .intro {
      padding: 70px 0;
    }

    .intro-big {
      max-width: 800px;

      font-size: clamp(25px, 7vw, 51px);

      line-height: 1.28;

      letter-spacing: -0.035em;

      font-weight: 600;
    }

    .intro-big span {
      color: #777;
    }

    .intro-small {
      margin-top: 36px;

      max-width: 580px;

      color: #888;

      font-size: 13px;
    }


    /* =========================================
       WORKS
    ========================================= */

    .filter-row {
      display: flex;
      gap: 8px;

      overflow-x: auto;

      margin-top: 38px;
      padding-bottom: 10px;

      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex: 0 0 auto;

      border: 1px solid var(--line);
      background: transparent;

      color: #888;

      min-height: 40px;
      padding: 0 17px;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.09em;

      cursor: pointer;
    }

    .filter-button.active {
      background: #f5f5f5;
      color: #050505;
      border-color: #f5f5f5;
    }

    .works-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 20px;
    }

    .work {
      position: relative;

      aspect-ratio: 0.78;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 40%,
          #242424,
          #0d0d0d 68%
        );

      cursor: pointer;
    }

    .work:nth-child(3n) {
      grid-column: span 2;
      aspect-ratio: 1.25;
    }

    .work img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      filter: grayscale(100%);

      transition:
        transform 0.45s ease,
        filter 0.45s ease;
    }

    .work:hover img {
      transform: scale(1.025);
      filter: grayscale(0%);
    }

    .work-placeholder {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #333;

      font-weight: 900;

      letter-spacing: 0.1em;

      font-size: 11px;

      text-align: center;
    }

    .work-label {
      position: absolute;

      left: 13px;
      right: 13px;
      bottom: 12px;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      z-index: 2;
    }

    .work-label strong {
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .work-label span {
      color: #999;
      font-size: 8px;
      letter-spacing: 0.1em;
    }

    .works-more {
      margin-top: 34px;
    }


    /* =========================================
       STYLE
    ========================================= */

    .style-list {
      margin-top: 45px;

      border-top: 1px solid var(--line);
    }

    .style-item {
      padding: 26px 0;

      display: grid;

      grid-template-columns:
        42px
        1fr;

      gap: 12px;

      border-bottom: 1px solid var(--line);
    }

    .style-number {
      color: #555;

      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .style-item h3 {
      font-size: clamp(23px, 7vw, 45px);

      letter-spacing: -0.04em;

      line-height: 1;

      margin-bottom: 10px;
    }

    .style-item p {
      color: #777;
      font-size: 12px;
      max-width: 500px;
    }


    /* =========================================
       PRICE
    ========================================= */

    .dark-panel {
      background: #0a0a0a;
    }

    .price-table {
      margin-top: 46px;
      border-top: 1px solid var(--line);
    }

    .price-row {
      padding: 22px 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;

      border-bottom: 1px solid var(--line);
    }

    .price-row span {
      color: #999;

      font-size: 10px;
      letter-spacing: 0.13em;
    }

    .price-row strong {
      text-align: right;
      font-size: 16px;
    }

    .price-note {
      margin-top: 24px;

      color: #666;

      font-size: 11px;
    }


    /* =========================================
       FIRST
    ========================================= */

    .flow {
      margin-top: 45px;
    }

    .flow-item {
      padding: 26px 0;

      display: grid;

      grid-template-columns:
        48px
        1fr;

      border-top: 1px solid var(--line);
    }

    .flow-item:last-child {
      border-bottom: 1px solid var(--line);
    }

    .flow-num {
      color: #555;
      font-size: 11px;
    }

    .flow-content h3 {
      font-size: 18px;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .flow-content p {
      color: #888;
      font-size: 12px;
    }


    /* =========================================
       ABOUT
    ========================================= */

    .about-visual {
      margin-top: 40px;

      aspect-ratio: 0.95;

      background:
        radial-gradient(
          circle at 50% 35%,
          #292929,
          #0c0c0c 68%
        );

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .about-visual::after {
      content: "ARTIST PHOTO";

      color: #333;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.15em;
    }

    .about-copy {
      margin-top: 35px;
    }

    .about-copy h3 {
      font-size: 29px;
      margin-bottom: 16px;
    }

    .about-copy p {
      color: #999;

      font-size: 13px;

      margin-bottom: 16px;
    }


    /* =========================================
       FAQ
    ========================================= */

    .faq-list {
      margin-top: 45px;
      border-top: 1px solid var(--line);
    }

    details {
      border-bottom: 1px solid var(--line);
    }

    summary {
      position: relative;

      list-style: none;

      padding: 24px 42px 24px 0;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";

      position: absolute;

      right: 4px;
      top: 50%;

      transform: translateY(-50%);

      color: #777;

      font-size: 21px;
      font-weight: 300;
    }

    details[open] summary::after {
      content: "−";
    }

    details p {
      color: #888;

      font-size: 12px;

      padding:
        0
        20px
        24px
        0;
    }


    /* =========================================
       ACCESS
    ========================================= */

    .access-grid {
      margin-top: 46px;
    }

    .access-row {
      padding: 21px 0;

      display: grid;

      grid-template-columns:
        110px
        1fr;

      gap: 10px;

      border-top: 1px solid var(--line);
    }

    .access-row:last-child {
      border-bottom: 1px solid var(--line);
    }

    .access-row dt {
      color: #666;

      font-size: 9px;
      letter-spacing: 0.12em;
    }

    .access-row dd {
      font-size: 13px;
    }

    .coming-soon-box {
      margin-top: 34px;

      border: 1px solid var(--line);

      min-height: 160px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 26px;
    }

    .coming-soon-box span {
      color: #555;

      font-size: 9px;
      letter-spacing: 0.18em;

      margin-bottom: 8px;
    }

    .coming-soon-box strong {
      font-size: 25px;
      letter-spacing: -0.03em;
    }

    .coming-soon-box p {
      color: #777;
      font-size: 11px;
      margin-top: 8px;
    }


    /* =========================================
       EVENT
    ========================================= */

    .event-card {
      margin-top: 40px;

      min-height: 220px;

      border: 1px solid var(--line);

      padding: 28px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .event-card small {
      color: #666;
      letter-spacing: 0.16em;
    }

    .event-card h3 {
      font-size: 31px;
      letter-spacing: -0.04em;
    }

    .event-card p {
      color: #777;
      font-size: 12px;
    }


    /* =========================================
       YOUTUBE
    ========================================= */

    .youtube-card {
      margin-top: 40px;

      aspect-ratio: 16 / 9;

      border: 1px solid var(--line);

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #090909;
    }

    .youtube-play {
      width: 62px;
      height: 62px;

      border: 1px solid #777;

      border-radius: 50%;

      display: grid;
      place-items: center;

      font-size: 15px;

      color: #888;
    }

    .youtube-status {
      position: absolute;

      bottom: 18px;
      left: 18px;

      color: #555;

      font-size: 9px;
      letter-spacing: 0.15em;
    }


    /* =========================================
       BOOKING
    ========================================= */

    .booking {
      padding:
        100px
        0
        110px;

      background: #f3f3f3;
      color: #050505;
    }

    .booking .eyebrow {
      color: #777;
    }

    .booking-title {
      font-size: clamp(59px, 18vw, 170px);

      line-height: 0.8;

      letter-spacing: -0.075em;

      font-weight: 900;
    }

    .booking-copy {
      margin-top: 28px;

      max-width: 560px;

      color: #555;

      font-size: 13px;
    }

    .booking-buttons {
      display: grid;

      grid-template-columns: 1fr;

      gap: 10px;

      margin-top: 35px;

      max-width: 480px;
    }

    .booking-button {
      min-height: 61px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      border: 1px solid #050505;

      color: #050505;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.11em;
    }

    .booking-button.primary {
      background: #050505;
      color: #fff;
    }

    .booking-button.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
